   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="173.588246" transform="rotate(-0 7.2 173.588246)">What the separate incomplete profiles show</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="191.107286" transform="rotate(-0 7.2 191.107286)">Cumulative profiler times overlap and include instrumentation. Attempts reached different work; CPU contention was present.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(124.72957 246.08597)">Baseline authentication</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(80.17875 261.071907)">188 global checks · 49.09 s cumulative</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(55.451055 277.171907)">Repeated syntax-tree comparison is prominent.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(523.686516 244.971907)">Prototype authentication</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(482.49675 261.071907)">130 global checks · 16.46 s cumulative</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(486.666398 277.171907)">6,521,060 provenance visits · 14.67 s</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="326.879846" transform="rotate(-0 7.2 326.879846)">These are diagnostic hotspots, not a before/after speedup benchmark.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="350.968526" transform="rotate(-0 7.2 350.968526)">The profile supports removing a duplicate provenance scan after immutable-session verification.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="372.867326" transform="rotate(-0 7.2 372.867326)">It does not establish cheaper complete planning, admitted resident execution, transfer savings, or either wall-time target.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="407.905406" transform="rotate(-0 7.2 407.905406)">Next decision: reassess the complete blocker map before adding capabilities; do not raise analysis budgets.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="431.994086" transform="rotate(-0 7.2 431.994086)">Prototype predates Comment-cloning / serialization-alias repairs and includes the owning-placement change after baseline.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="452.578958" transform="rotate(-0 7.2 452.578958)">Raw pstats, stack samples, source hashes, capture facts, request options, and corrected profile attribution are frozen beside this chart.</text>
   </g>

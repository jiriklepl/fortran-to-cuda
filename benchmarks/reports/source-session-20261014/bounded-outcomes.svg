   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="24.676406" transform="rotate(-0 7.2 24.676406)">Bounded Convection generation: no application qualification</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213047" x="7.2" y="46.575206" transform="rotate(-0 7.2 46.575206)">300-second generation cap unchanged · separate 180-second profiles of baseline / prototype · no application or GPU execution</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #213047" transform="translate(73.658969 93.307964)">BASELINE  5d752da</text>

# ELMM, the large-eddy simulation of the atmospheric boundary layer, with its time step on the GPU.
#
# The step of the supported configuration (see templates/rk-supported.f90) runs as compiled entries of ELMM's
# own loops: the subgrid model, the momentum terms, the boundaries, advection, the filter, the pressure step
# around a device Poisson solver (sources/), the diagnostics, the outputs, the forces and the wall model.
name = "ELMMResident"

# The sources of ELMM's serial build, in the order of its SConstruct, and PoisFFT's.
sources = [
    "elmm:src/dummy_par.f90",
    "elmm:src/parameters.f90",

[project]
name = "fort_to_cuda"
version = "0.1.0"

[dependency-groups]
dev = [
    "fparser>=0.2.0,<0.3",
    "pytest>=8.3,<10",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = false

[tool.ruff.lint]
# Keep formatting in the formatter; lint for errors, imports, modern Python,
# common bugs, unnecessary complexity, and pytest conventions.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["compiler"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
